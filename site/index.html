<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cung Solutions · Automationen und Websites für KMU</title>
    <meta name="description" content="Ich automatisiere Anfragen, Offerten und Termine für KMU im Aargau und baue Websites zum Fixpreis." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cung Solutions · Automationen und Websites für KMU" />
    <meta property="og:description" content="Keine Anfrage geht mehr verloren: Automationen und Websites zum Fixpreis, aus Brugg." />
    <meta property="og:locale" content="de_CH" />
    <meta name="twitter:card" content="summary" />
    <style>
      html{scroll-padding-top:72px;scroll-behavior:smooth}
      /* Flat design (KGC): plain body colour, no ambient light, grain or gradient text. */
      body{background:var(--color-background-body, var(--color-background-surface))}
      /* Sections rise into view while scrolling (Chrome/Edge/Safari 26); nothing moves with Reduce Motion. */
      @media (prefers-reduced-motion: no-preference){@supports (animation-timeline: view()){
        main > *:not(#top){animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 30%}
        @keyframes rise{from{opacity:0;transform:translateY(32px) scale(.985)}}
      }}
      .viz-down{transform:rotate(90deg)}
      /* Configurator: the live preview follows while the add-on list scrolls (two-column widths only). */
      @media (min-width: 64rem){[data-sticky]{position:sticky;top:5rem}}
      @media (min-width: 64rem){[data-cfg]{grid-template-columns:minmax(20rem,25rem) minmax(0,1fr)!important}}
      /* Automations film: scenes fade in, the ringing phone shakes. */
      @media (prefers-reduced-motion: no-preference){[data-scene]{animation:scenein .6s ease-out both}[data-ring]{animation:ring 1s ease-in-out infinite}}
      @keyframes scenein{from{opacity:0;transform:scale(1.03)}}
      @keyframes ring{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-12deg)}20%,40%{transform:rotate(12deg)}50%{transform:rotate(0)}}
      @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
      /* Parts that appear in the configurator preview pop in. */
      @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}}
      @media (prefers-reduced-motion: no-preference){[data-pop]{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Diese Seite benötigt JavaScript. Kontakt: khang@cung-solutions.ch</noscript>
    <!-- Netlify Forms reads this at deploy time; the React contact page posts to it. -->
    <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="bot-field"><input name="name"><input name="email"><input name="phone"><input name="subject"><textarea name="message"></textarea></form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
