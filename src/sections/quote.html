<section id="offerte" class="section quote">
  <!-- Static copy of the quote form so Netlify Forms detects it at deploy time; the real form is built by quote.js -->
  <form name="offerte-anfrage" data-netlify="true" netlify-honeypot="bot-field" hidden aria-hidden="true">
    <input name="bot-field"><input name="name"><input name="firma"><input type="email" name="email"><input name="telefon"><textarea name="nachricht"></textarea><textarea name="zusammenfassung"></textarea>
  </form>
  <div class="wrap">
    <header class="quote-head reveal">
      <span class="eyebrow"><span data-l="de">Offerte</span><span data-l="en">Quote</span></span>
      <h2><span data-l="de">Ihre Offerte in <em class="it">60 Sekunden</em></span><span data-l="en">Your quote in <em class="it">60 seconds</em></span></h2>
      <p class="lede">
        <span data-l="de">Wählen Sie aus. Der Preis wird live berechnet.</span>
        <span data-l="en">Pick what you need. The price updates live.</span>
      </p>
    </header>
    <div id="quote-app" class="quote-app"></div>
  </div>
</section>
